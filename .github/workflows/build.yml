name: Build and release

on:
  push:
    branches: [main, verify/windows-editor-gif]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.version.outputs.label }}
      macos: ${{ steps.version.outputs.macos }}
      windows: ${{ steps.version.outputs.windows }}
      build: ${{ steps.version.outputs.build }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish_appcast: ${{ github.event_name == 'push' && github.ref_type == 'tag' && steps.version.outputs.prerelease == 'false' && vars.TAPSNAP_UPDATE_PUBLIC_KEY != '' }}
    steps:
      - name: Set package metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          label="ci-$GITHUB_RUN_NUMBER"
          macos=""
          windows="0.0.0-ci.$GITHUB_RUN_NUMBER"
          prerelease=false
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version='^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))(-[a-zA-Z0-9]+([.-][a-zA-Z0-9]+)*)?$'
            if [[ ! "$GITHUB_REF_NAME" =~ $version ]]; then
              echo "::error::Use a version tag such as v0.2.0 or v0.2.0-rc.1."
              exit 1
            fi
            label="$GITHUB_REF_NAME"
            macos="${BASH_REMATCH[1]}"
            windows="${GITHUB_REF_NAME#v}"
            if [[ "$windows" != "$macos" ]]; then
              prerelease=true
            fi
          fi
          # Continue after the last locally packaged build (5).
          {
            echo "label=$label"
            echo "macos=$macos"
            echo "windows=$windows"
            echo "build=$((GITHUB_RUN_NUMBER + 5))"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  macos:
    name: macOS ARM64
    needs: version
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
      TAPSNAP_VERSION: ${{ needs.version.outputs.macos }}
      TAPSNAP_BUILD_NUMBER: ${{ needs.version.outputs.build }}
      PACKAGE_LABEL: ${{ needs.version.outputs.label }}
      TAPSNAP_UPDATE_FEED_URL: ${{ needs.version.outputs.publish_appcast == 'true' && format('{0}/{1}/releases/latest/download/appcast.xml', github.server_url, github.repository) || '' }}
      TAPSNAP_UPDATE_PUBLIC_KEY: ${{ needs.version.outputs.publish_appcast == 'true' && vars.TAPSNAP_UPDATE_PUBLIC_KEY || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test on the hosted runner
        shell: bash
        run: |
          swift --version
          # These tests require a desktop session or native encoders and recognition hardware.
          desktop='CaptureModeHandoffTests|ClipboardHistoryPersistenceTests|EditFeatureCompletionTests|EditorDockLayoutTests|GlobalShortcutTests|PrivacyCaptureTests|PrivacyVisualAITests|RecordingClipboardTests|UIRegionDetectorTests'
          encoder='GifExporterTests|RecordingAnnotationStyleTests|RecordingEnhancementTests|VideoEncoderTests|RecordSessionTests/test(RealEncoder|StaticScreen)'
          swift test --skip "$desktop|$encoder"
      - name: Build the macOS release with its persistent signing identity
        if: github.ref_type == 'tag' && needs.version.outputs.prerelease == 'false'
        shell: bash
        env:
          TAPSNAP_MAC_SIGNING_SHA1: ${{ vars.TAPSNAP_MAC_SIGNING_SHA1 }}
          TAPSNAP_MAC_SIGNING_P12: ${{ secrets.TAPSNAP_MAC_SIGNING_P12 }}
          TAPSNAP_MAC_SIGNING_PASSWORD: ${{ secrets.TAPSNAP_MAC_SIGNING_PASSWORD }}
        run: bash Scripts/build-signed-macos.sh
      - name: Build the macOS CI package
        if: github.ref_type != 'tag' || needs.version.outputs.prerelease == 'true'
        run: Scripts/build-app.sh release
      - name: Verify the app and build the DMG
        shell: bash
        run: |
          set -euo pipefail
          app=dist/TapSnap.app
          plist="$app/Contents/Info.plist"
          test "$(lipo -archs "$app/Contents/MacOS/TapSnap")" = arm64
          test "$(plutil -extract CFBundleVersion raw -o - "$plist")" = "$TAPSNAP_BUILD_NUMBER"
          if [[ -n "$TAPSNAP_VERSION" ]]; then
            test "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$TAPSNAP_VERSION"
          fi
          if [[ -n "$TAPSNAP_UPDATE_FEED_URL" ]]; then
            test "$(plutil -extract SUFeedURL raw -o - "$plist")" = "$TAPSNAP_UPDATE_FEED_URL"
            test "$(plutil -extract SUPublicEDKey raw -o - "$plist")" = "$TAPSNAP_UPDATE_PUBLIC_KEY"
            test "$(plutil -extract SUEnableDownloaderService raw -o - "$plist")" = true
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          staging=$(mktemp -d "$RUNNER_TEMP/tapsnap-dmg.XXXXXX")
          trap 'rm -rf "$staging"' EXIT
          ditto "$app" "$staging/TapSnap.app"
          ln -s /Applications "$staging/Applications"
          dmg="dist/TapSnap-$PACKAGE_LABEL-macos-arm64.dmg"
          hdiutil create -volname TapSnap -srcfolder "$staging" -fs HFS+ -format UDZO "$dmg"
          hdiutil verify "$dmg"
      - name: Generate the signed Sparkle update feed
        if: needs.version.outputs.publish_appcast == 'true'
        shell: bash
        env:
          TAPSNAP_UPDATE_PRIVATE_KEY: ${{ secrets.TAPSNAP_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${TAPSNAP_UPDATE_PRIVATE_KEY:?Set the TAPSNAP_UPDATE_PRIVATE_KEY repository secret}"
          private_key=$TAPSNAP_UPDATE_PRIVATE_KEY
          unset TAPSNAP_UPDATE_PRIVATE_KEY
          public_key=$(printf '%s\n' "$private_key" | swift -e '
            import Foundation
            import CryptoKit
            guard let value = readLine(), let seed = Data(base64Encoded: value), seed.count == 32 else {
                exit(1)
            }
            let key = try Curve25519.Signing.PrivateKey(rawRepresentation: seed)
            print(key.publicKey.rawRepresentation.base64EncodedString())
          ')
          if [[ "$public_key" != "$TAPSNAP_UPDATE_PUBLIC_KEY" ]]; then
            echo "::error::The Sparkle signing key does not match TAPSNAP_UPDATE_PUBLIC_KEY."
            exit 1
          fi

          scratch=$(mktemp -d "$RUNNER_TEMP/tapsnap-sparkle.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          # Match the Sparkle framework version in Package.swift.
          archive="$scratch/Sparkle-2.10.1.tar.xz"
          curl --fail --silent --show-error --location --retry 3 -o "$archive" \
            'https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz'
          printf '%s  %s\n' '1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27' "$archive" | shasum -a 256 -c
          tar -xf "$archive" -C "$scratch" ./bin/generate_appcast
          mkdir "$scratch/updates"
          cp "dist/TapSnap-$PACKAGE_LABEL-macos-arm64.dmg" "$scratch/updates/"
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
          printf '%s\n' "$private_key" | "$scratch/bin/generate_appcast" --ed-key-file - \
            --maximum-deltas 0 --download-url-prefix "$release_url/download/$GITHUB_REF_NAME/" \
            --link "$release_url/tag/$GITHUB_REF_NAME" "$scratch/updates"
          test -s "$scratch/updates/appcast.xml"
          mv "$scratch/updates/appcast.xml" dist/appcast.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-packages
          path: |
            dist/*.dmg
            dist/appcast.xml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    name: Windows x64 and ARM64
    needs: version
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      TAPSNAP_VERSION: ${{ needs.version.outputs.windows }}
      PACKAGE_LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build and run the regression programs
        shell: pwsh
        run: |
          dotnet build windows/TapSnap.Windows.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($suite in 'SelectionTests', 'LongShotTests', 'PrivacyTests', 'ImageFormatTests') {
            dotnet run --project "windows/Tests/$suite" -c Release --no-build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check out the Windows GIF baseline
        if: github.ref == 'refs/heads/verify/windows-editor-gif'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.2.3
          path: .baseline-windows
          persist-credentials: false
      - name: Test native selection, clipboard filters, timed video edits and GIF exports
        if: github.ref == 'refs/heads/verify/windows-editor-gif'
        timeout-minutes: 8
        shell: pwsh
        run: |
          dotnet build .baseline-windows/windows/TapSnap.Windows/TapSnap.Windows.csproj -c Release -o "$env:RUNNER_TEMP/tapsnap-old"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project windows/Tests/DesktopWorkflowTests -c Release --no-build -- "$env:RUNNER_TEMP/tapsnap-old/TapSnap.dll" "$PWD/assets/readme/capture-overview.webp" "$PWD/windows-evidence"
          exit $LASTEXITCODE
      - name: Upload the recording samples and native interface screenshots
        if: always() && github.ref == 'refs/heads/verify/windows-editor-gif'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-verification
          path: windows-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish and verify the Windows ZIP files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $architectures = @{ 'x64' = 0x8664; 'arm64' = 0xAA64 }
          foreach ($arch in 'x64', 'arm64') {
            $publish = Join-Path $env:RUNNER_TEMP "tapsnap-$arch"
            dotnet publish windows/TapSnap.Windows -c Release -r "win-$arch" --self-contained true "-p:Version=$env:TAPSNAP_VERSION" -o $publish
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $exe = [IO.File]::ReadAllBytes((Join-Path $publish 'TapSnap.exe'))
            $header = [BitConverter]::ToInt32($exe, 0x3c)
            if ([BitConverter]::ToUInt16($exe, $header + 4) -ne $architectures[$arch]) {
              throw "TapSnap.exe architecture does not match $arch."
            }

            $zip = Join-Path (Resolve-Path dist).Path "TapSnap-$($env:PACKAGE_LABEL)-windows-$arch.zip"
            [IO.Compression.ZipFile]::CreateFromDirectory($publish, $zip)
            $archive = [IO.Compression.ZipFile]::OpenRead($zip)
            try {
              $entries = $archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') }
              foreach ($file in 'TapSnap.exe', 'hostfxr.dll', 'tessdata/eng.traineddata', 'tessdata/chi_sim.traineddata', 'Recognition/Install-Formula.ps1', 'Recognition/KaTeX/katex.js') {
                if ($file -notin $entries) { throw "$file is missing from $zip." }
              }
            } finally {
              $archive.Dispose()
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-packages'
          path: release
          merge-multiple: true
      - name: Publish verified packages and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          PUBLISH_APPCAST: ${{ needs.version.outputs.publish_appcast }}
        working-directory: release
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          files=(
            "TapSnap-$tag-macos-arm64.dmg"
            "TapSnap-$tag-windows-x64.zip"
            "TapSnap-$tag-windows-arm64.zip"
          )
          if [[ "$PUBLISH_APPCAST" == true ]]; then
            files+=(appcast.xml)
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          files+=(SHA256SUMS.txt)

          if state=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$state" == false ]]; then
              assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
              for file in "${files[@]}"; do
                grep -Fxq -- "$file" <<< "$assets"
              done
              exit 0
            fi
          else
            flags=(--draft --verify-tag --generate-notes --title "TapSnap $tag")
            if [[ "$PRERELEASE" == true ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$tag" "${flags[@]}" --notes 'macOS 包使用临时签名，未公证。Windows ZIP 内含 .NET 运行时，请解压后打开 TapSnap.exe。'
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          publish_flags=(--draft=false --verify-tag)
          if [[ "$PUBLISH_APPCAST" == true ]]; then
            publish_flags+=(--latest)
          fi
          gh release edit "$tag" "${publish_flags[@]}"
